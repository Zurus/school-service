server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://10.7.118.8:5432/test_cmd
    username: postgres_dev
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update

# Конфигурация Camunda
camunda:
  bpm:
    database:
      type: postgres
      schema-update: true
    history-level: audit
    job-executor:
      enabled: true
    jdbc:
      batch-processing: false

logging:
  level:
    # Детальное логирование Camunda
    org.camunda.bpm.engine.impl.db.sql: DEBUG
    org.camunda.bpm.engine.impl.db: TRACE
    org.camunda.bpm.engine.impl.persistence.entity: TRACE

    # Логирование JDBC
    org.apache.ibatis: DEBUG
    java.sql: DEBUG
    java.sql.Connection: DEBUG
    java.sql.Statement: DEBUG
    java.sql.PreparedStatement: DEBUG

    # Hibernate
    org.hibernate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
    org.hibernate.engine.transaction.internal: DEBUG

    # Spring
    org.springframework.jdbc.core: DEBUG
    org.springframework.orm.jpa: DEBUG