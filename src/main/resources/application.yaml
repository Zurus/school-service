server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/testdb;DB_CLOSE_ON_EXIT=FALSE
#    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

# Минимальная конфигурация Camunda
camunda:
  bpm:
    database:
      schema-update: true
#      table-prefix: ACT_
    history-level: none
    job-executor:
      enabled: true
      deployment-aware: false
    jdbc:
      batch-processing: false

logging:
  level:
    org.camunda: INFO
    ru.schoolservice.arm: DEBUG